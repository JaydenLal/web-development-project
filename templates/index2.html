<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Database Dashboard</title>
  <!-- Link css stylesheet -->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <div class="app-shell">
    <!-- Top header -->
    <header class="topbar">
      <div>
        <h1>SQLite Database Viewer</h1>
      </div>

      <div class="topbar-nav">
        <a href="/about" class="about">About</a>
        <select class="dropdown" onchange="location = this.value;">
          <option value="">Player score sorted lowest to highest</option>
          <option value="/">Player score sorted highest to lowest</option>
        </select>
      </div>
    </header>

    <!-- Main content area -->
    <main class="content-grid">
      <section class="main-panel">
        <div class="panel-header">
          <div class="panel-title">
            <h2>Current Database > Player score sorted lowest to highest</h2>
          </div>
        </div>

        <!-- Data table, this is where the database rows are shown -->
        <div class="table-card">
          <div class="table-topbar">
            <!-- Search form for index2 -->
            <form method="get" action="/index2">
              <input name="q" type="search" placeholder="search..." value="{{ q }}" />
              <button type="submit">Search</button>
            </form>
          </div>

          <div class="data-grid">
            <div class="table-section">
              <!-- Table header, names of each column in the data view -->
              <div class="table-header-row">
                <span>Player</span>
                <span>Game</span>
                <span>School</span>
                <span>Year</span>
                <span>Score</span>
              </div>

              <!-- Loop through every database record and show it as a row -->
              {% for row in records %}
              <div class="table-row"
                   data-name="{{ row['first_name'] }}"
                   data-status="{{ row['school'] }}"
                   data-updated="{{ row['year'] }}"
                   data-rows="{{ row['score'] }}"
                   data-key="{{ row['game'] }}">

                <span>{{ row['first_name'] }}</span>
                <span>{{ row['game'] }}</span>
                <span>{{ row['school'] }}</span>
                <span>{{ row['year'] }}</span>
                <span>{{ row['score'] }}</span>
              </div>
              {% endfor %}
            </div>
          </div>
        </div>
      </section>

    </main>
  </div>
</body>
</html>

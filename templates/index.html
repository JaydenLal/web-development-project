<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Database Dashboard</title>
  <!-- Link css stylesheet -->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <div class="app-shell">
    <!-- Top header -->
    <header class="topbar">
      <div>
        <h1>SQLite Database Viewer</h1>
        <p class="topbar-note">Single database preview</p>
      </div>
      <div class="search-box">
        <label for="global-search" class="sr-only">Search</label>
        <input id="global-search" type="search" />
      </div>
    </header>

    <!-- Main content area -->
    <main class="content-grid">
      <section class="main-panel">
        <div class="panel-header">
          <div class="panel-title">
            <h2>Current Database</h2>
          </div>
          <button class="icon-button" id="open-settings" aria-label="Open settings">⚙</button>
        </div>

        <!-- Data table, this is where the database rows are shown -->
        <div class="table-card">
          <div class="table-topbar">
            <input type="search" />
          </div>

          <div class="data-grid">
            <div class="table-section">
              <!-- Table header, names of each column in the data view -->
              <div class="table-header-row">
                <span>Player</span>
                <span>Game</span>
                <span>School</span>
                <span>Year</span>
                <span>Score</span>
              </div>

              <!-- Loop through every database record and show it as a row -->
              {% for row in records %}
              <div class="table-row"
                   data-name="{{ row['first_name'] }}"
                   data-status="{{ row['school'] }}"
                   data-updated="{{ row['year'] }}"
                   data-rows="{{ row['score'] }}"
                   data-key="{{ row['game'] }}">

                <span>{{ row['first_name'] }}</span>
                <span>{{ row['game'] }}</span>
                <span>{{ row['school'] }}</span>
                <span>{{ row['year'] }}</span>
                <span>{{ row['score'] }}</span>
              </div>
              {% endfor %}
            </div>
          </div>
        </div>
      </section>

      <!-- Sidebar navigation for the dashboard layout -->
      <aside class="sidebar">
        <nav>
          <p class="nav-title">Navigation</p>
          <a href="#">Databases</a>
          <a href="#">Tables</a>
          <a href="#">Columns</a>
          <a href="#" id="nav-settings" aria-label="Toggle dark mode">Dark mode</a>
        </nav>
      </aside>
    </main>

    <!-- JavaScript to toggle dark mode -->
    <script>
      (function(){
        const btn = document.getElementById('open-settings');
        const nav = document.getElementById('nav-settings');
        function toggle() { document.body.classList.toggle('dark-mode'); }
        if (btn) btn.addEventListener('click', toggle);
        if (nav) nav.addEventListener('click', (e) => { e.preventDefault(); toggle(); });
      })();
    </script>
  </div>
</body>
</html>
